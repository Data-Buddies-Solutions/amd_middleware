steps:
  - id: test
    name: golang:1.26.5
    entrypoint: /bin/bash
    args:
      - -c
      - |
        set -euo pipefail
        go test ./...
        curl --fail --silent --show-error --location https://github.com/astral-sh/uv/releases/download/0.12.15/uv-x86_64-unknown-linux-gnu.tar.gz --output /tmp/uv.tar.gz
        echo "f97935763c04be3e692460a7aaeaaab8fc3b78fcf8b389da820b38ae7423a638  /tmp/uv.tar.gz" | sha256sum --check --strict
        tar -xzf /tmp/uv.tar.gz -C /tmp
        export PATH="/tmp/uv-x86_64-unknown-linux-gnu:$$PATH"
        scripts/test-agent-contract.sh

  - id: deployment-script-test
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: /bin/bash
    args: [scripts/deploy-cloud-run_test.sh]

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: /bin/bash
    args: [scripts/deploy-cloud-run.sh]
    env:
      - PROJECT_ID=$PROJECT_ID
      - REGION=${_REGION}
      - REPOSITORY=${_REPOSITORY}
      - IMAGE=${_IMAGE}
      - SERVICE=${_SERVICE}
      - RUNTIME_SERVICE_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}
      - IMAGE_TAG=$COMMIT_SHA
      - DEPLOYMENT_ID=$BUILD_ID
      - DEPLOY_MODE=request
      - MAINTENANCE_OIDC_AUDIENCE=${_MAINTENANCE_OIDC_AUDIENCE}
      - MAINTENANCE_OIDC_SERVICE_ACCOUNT=${_MAINTENANCE_OIDC_SERVICE_ACCOUNT}
      - MAINTENANCE_SCHEDULE=${_MAINTENANCE_SCHEDULE}
      - MAINTENANCE_JOB=${_MAINTENANCE_JOB}

substitutions:
  _REGION: us-east4
  _REPOSITORY: services
  _IMAGE: abita-middleware
  _SERVICE: abita-middleware
  _RUNTIME_SERVICE_ACCOUNT: abita-middleware@acuity-health-prod.iam.gserviceaccount.com
  _MAINTENANCE_OIDC_AUDIENCE: DO_NOT_DEPLOY
  _MAINTENANCE_OIDC_SERVICE_ACCOUNT: DO_NOT_DEPLOY
  _MAINTENANCE_SCHEDULE: 0 */12 * * *
  _MAINTENANCE_JOB: abita-middleware-session-maintenance

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
