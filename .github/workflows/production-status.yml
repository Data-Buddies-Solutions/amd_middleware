name: Production status

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  checks: read
  contents: read

concurrency:
  group: production-status-${{ github.sha }}
  cancel-in-progress: false

jobs:
  track-cloud-run:
    name: Track Cloud Run deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://abita-middleware-cbuqwpsdsq-uk.a.run.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for Cloud Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-cloud-build.sh "abita-middleware-main-build (acuity-health-prod)"
