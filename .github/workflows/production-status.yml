name: Production status

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  checks: read
  contents: read

concurrency:
  group: production-status-${{ github.sha }}
  cancel-in-progress: false

jobs:
  track-cloud-run:
    name: Track Cloud Run deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://abita-middleware-cbuqwpsdsq-uk.a.run.app
    steps:
      - name: Wait for Cloud Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            check="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                --jq '[
                    .check_runs[]
                    | select(
                        .name == "abita-middleware-main-build (acuity-health-prod)"
                        and .app.name == "Google Cloud Build"
                      )
                  ]
                  | first
                  | if . == null then
                      empty
                    else
                      [.status, (.conclusion // "")]
                      | @tsv
                    end'
            )"

            if [[ -z "$check" ]]; then
              echo "Waiting for the Cloud Build check to appear."
              sleep 10
              continue
            fi

            IFS=$'\t' read -r status conclusion <<< "$check"
            if [[ "$status" != "completed" ]]; then
              echo "Cloud Build is $status."
              sleep 10
              continue
            fi

            if [[ "$conclusion" == "success" ]]; then
              echo "Cloud Build deployed $GITHUB_SHA successfully."
              exit 0
            fi

            echo "Cloud Build completed with conclusion: $conclusion" >&2
            exit 1
          done

          echo "Timed out waiting for Cloud Build to finish." >&2
          exit 1
