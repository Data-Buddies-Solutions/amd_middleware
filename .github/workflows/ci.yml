name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race ./...

      - name: Deployment script test
        run: scripts/deploy-cloud-run_test.sh

      - name: Sandbox deployment script test
        run: bash scripts/deploy-sandbox-cloud-run_test.sh

      - name: Staging deployment verification test
        run: python3 -m unittest discover -s scripts -p 'staging_deployment_test.py'
